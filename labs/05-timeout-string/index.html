<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>05 setTimeout string</title>
</head>
<body>
  <h1>05 setTimeout string</h1>
  <p>The fragment is passed to setTimeout as a string, so it is compiled.</p>
  <script>
    setTimeout(decodeURIComponent(location.hash.slice(1)), 0);
  </script>
</body>
</html>
